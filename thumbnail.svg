<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowPink" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBlue" cx="80%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowCyan" cx="50%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>
    <linearGradient id="cyanGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="flowWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="flowWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="1080" fill="#07090E"/>

  <!-- Background Glow Orbs -->
  <rect width="1920" height="1080" fill="url(#bgGlowPink)"/>
  <rect width="1920" height="1080" fill="url(#bgGlowBlue)"/>
  <rect width="1920" height="1080" fill="url(#bgGlowCyan)"/>

  <!-- Subtle Matrix Grid -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
  </g>

  <!-- Flow Wave Lines (Representing Two-Speed Flow Debt) -->
  <path d="M 0 550 C 400 380, 800 680, 1200 480 C 1500 330, 1750 520, 1920 460" fill="none" stroke="url(#flowWave1)" stroke-width="6" filter="url(#glowPink)" opacity="0.85"/>
  <path d="M 0 620 C 450 780, 850 480, 1250 640 C 1600 780, 1800 600, 1920 580" fill="none" stroke="url(#flowWave2)" stroke-width="6" filter="url(#glowCyan)" opacity="0.85"/>
  <path d="M 0 585 C 500 520, 900 600, 1300 540 C 1650 480, 1850 560, 1920 520" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/>

  <!-- Floating Glow Particles -->
  <circle cx="340" cy="460" r="4" fill="#FF007A" opacity="0.8" filter="url(#glowPink)"/>
  <circle cx="680" cy="620" r="5" fill="#00F2FE" opacity="0.8" filter="url(#glowCyan)"/>
  <circle cx="1120" cy="420" r="6" fill="#10B981" opacity="0.9" filter="url(#glowCyan)"/>
  <circle cx="1560" cy="510" r="4" fill="#9d4edd" opacity="0.8"/>
  <circle cx="920" cy="300" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="1380" cy="690" r="5" fill="#FF007A" opacity="0.7"/>

  <!-- ================= LEFT COLUMN: HERO TITLES & TAGS ================= -->
  
  <!-- Top Badge Ribbon -->
  <g transform="translate(120, 130)">
    <rect width="210" height="42" rx="21" fill="#FF007A" fill-opacity="0.14" stroke="#FF007A" stroke-width="1.5"/>
    <text x="105" y="27" fill="#FF007A" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">🦄 UNISWAP v4</text>

    <g transform="translate(225, 0)">
      <rect width="200" height="42" rx="21" fill="#0052FF" fill-opacity="0.15" stroke="#0052FF" stroke-width="1.5"/>
      <text x="100" y="27" fill="#3B82F6" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">🔵 BASE SEPOLIA</text>
    </g>

    <g transform="translate(440, 0)">
      <rect width="190" height="42" rx="21" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-width="1.5"/>
      <text x="95" y="27" fill="#10B981" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">🏆 UHI HOOKATHON</text>
    </g>
  </g>

  <!-- Project Main Title -->
  <text x="120" y="320" fill="url(#titleGradient)" font-family="'Inter', 'Outfit', sans-serif" font-size="118" font-weight="900" letter-spacing="-3">
    FairFlow
  </text>

  <!-- Tagline / Subtitle -->
  <text x="120" y="390" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
    Two-Speed Flow-Debt Pricing for Uniswap v4
  </text>

  <!-- Description paragraph -->
  <text x="120" y="445" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="22" font-weight="400">
    Oracle-Free LP Fee Hook that penalizes same-block toxic reversals
  </text>
  <text x="120" y="480" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="22" font-weight="400">
    while rewarding delayed restorative counterflow with real discounts.
  </text>

  <!-- Feature Bullet Cards (Left) -->
  <g transform="translate(120, 540)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="540" height="66" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="14" fill="#F43F5E" fill-opacity="0.2"/>
      <text x="36" y="38" font-size="15" text-anchor="middle">📈</text>
      <text x="66" y="29" fill="#F43F5E" font-family="'Inter', sans-serif" font-size="17" font-weight="700">Directional Congestion Premium</text>
      <text x="66" y="50" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Rapid same-direction swaps hike fees dynamically (8 pips/tick)</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 82)">
      <rect width="540" height="66" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="14" fill="#EAB308" fill-opacity="0.2"/>
      <text x="36" y="38" font-size="15" text-anchor="middle">🥪</text>
      <text x="66" y="29" fill="#FACC15" font-family="'Inter', sans-serif" font-size="17" font-weight="700">Anti-Sandwich Reversal Premium</text>
      <text x="66" y="50" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Eliminates back-run subsidies via 15 pips/tick penalty</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 164)">
      <rect width="540" height="66" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="14" fill="#22C55E" fill-opacity="0.2"/>
      <text x="36" y="38" font-size="15" text-anchor="middle">💚</text>
      <text x="66" y="29" fill="#4ADE80" font-family="'Inter', sans-serif" font-size="17" font-weight="700">Restorative Counterflow Discount</text>
      <text x="66" y="50" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Opposing swaps that repay mature inventory debt earn fee discounts</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: INTERACTIVE DEMO SHOWCASE ================= -->
  
  <g transform="translate(1040, 150)" filter="url(#shadowCard)">
    <!-- Big Glass Panel Frame -->
    <rect width="760" height="740" rx="28" fill="url(#cardGlass)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <rect width="760" height="740" rx="28" fill="none" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.3"/>

    <!-- Panel Header Bar -->
    <rect x="0" y="0" width="760" height="68" rx="28" fill="#1E293B" fill-opacity="0.5"/>
    <circle cx="36" cy="34" r="7" fill="#EF4444"/>
    <circle cx="58" cy="34" r="7" fill="#F59E0B"/>
    <circle cx="80" cy="34" r="7" fill="#10B981"/>
    
    <text x="380" y="42" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="0.5">
      FairFlow v4 • Live On-Chain Protocol Metrics
    </text>
    <rect x="620" y="20" width="105" height="28" rx="14" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <circle cx="635" cy="34" r="4" fill="#10B981"/>
    <text x="675" y="39" fill="#10B981" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">LIVE TESTNET</text>

    <!-- Stat Metric Boxes (Row 1) -->
    <g transform="translate(35, 95)">
      <!-- Metric 1: Baseline Fee -->
      <rect width="216" height="110" rx="16" fill="#0B1120" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="20" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">1. CALM BASELINE</text>
      <text x="20" y="78" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="36" font-weight="800">5.00 <tspan font-size="20" fill="#64748B">bp</tspan></text>
      <text x="20" y="98" fill="#00F2FE" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Standard Retail Flow</text>
      
      <!-- Metric 2: Congestion Fee -->
      <g transform="translate(236, 0)">
        <rect width="216" height="110" rx="16" fill="#0B1120" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1"/>
        <text x="20" y="32" fill="#FB7185" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">2. CONGESTION HIKE</text>
        <text x="20" y="78" fill="#F43F5E" font-family="'Inter', sans-serif" font-size="36" font-weight="800">5.34 <tspan font-size="20" fill="#FB7185">bp</tspan></text>
        <text x="20" y="98" fill="#FDA4AF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">📈 +0.34 bp Dynamic Hike</text>
      </g>

      <!-- Metric 3: Counterflow Discount -->
      <g transform="translate(472, 0)">
        <rect width="216" height="110" rx="16" fill="#0B1120" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1"/>
        <text x="20" y="32" fill="#4ADE80" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">3. COUNTERFLOW</text>
        <text x="20" y="78" fill="#22C55E" font-family="'Inter', sans-serif" font-size="36" font-weight="800">4.61 <tspan font-size="20" fill="#4ADE80">bp</tspan></text>
        <text x="20" y="98" fill="#86EFAC" font-family="'Inter', sans-serif" font-size="12" font-weight="600">💚 -0.39 bp Fee Rebate</text>
      </g>
    </g>

    <!-- Two-Speed Mechanism Diagram (Row 2) -->
    <g transform="translate(35, 230)">
      <rect width="690" height="210" rx="18" fill="#0B1120" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      
      <text x="24" y="36" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="16" font-weight="700">
        ⚡ Two-Speed Flow-Debt Engine State
      </text>

      <!-- Lane 1: Block Debt -->
      <g transform="translate(24, 60)">
        <rect width="305" height="120" rx="12" fill="#1E293B" fill-opacity="0.5" stroke="rgba(255, 0, 122, 0.25)" stroke-width="1"/>
        <text x="18" y="28" fill="#FF007A" font-family="'Inter', sans-serif" font-size="14" font-weight="700">⏱️ FAST CLOCK: Block Debt</text>
        <text x="18" y="52" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Accumulates within current block</text>
        <rect x="18" y="70" width="268" height="8" rx="4" fill="#334155"/>
        <rect x="18" y="70" width="195" height="8" rx="4" fill="url(#accentGradient)"/>
        <text x="18" y="100" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Prevents Same-Block MEV Reversals</text>
      </g>

      <!-- Lane 2: Mature Debt -->
      <g transform="translate(360, 60)">
        <rect width="305" height="120" rx="12" fill="#1E293B" fill-opacity="0.5" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1"/>
        <text x="18" y="28" fill="#00F2FE" font-family="'Inter', sans-serif" font-size="14" font-weight="700">⏳ SLOW CLOCK: Mature Debt</text>
        <text x="18" y="52" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Decays smoothly across inactive blocks</text>
        <rect x="18" y="70" width="268" height="8" rx="4" fill="#334155"/>
        <rect x="18" y="70" width="130" height="8" rx="4" fill="url(#cyanGreenGrad)"/>
        <text x="18" y="100" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Rewards Inventory Rebalancing Flow</text>
      </g>
    </g>

    <!-- Verified Live Proof Swaps (Row 3) -->
    <g transform="translate(35, 465)">
      <rect width="690" height="235" rx="18" fill="#0B1120" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      
      <text x="24" y="34" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="15" font-weight="700">
        🔗 Verified Base Sepolia Transactions (Live BaseScan)
      </text>

      <!-- Row 1: Calm -->
      <g transform="translate(24, 52)">
        <rect width="642" height="42" rx="8" fill="#1E293B" fill-opacity="0.4"/>
        <text x="16" y="26" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="13" font-weight="700">0x3afabd...</text>
        <text x="160" y="26" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">Buy fUSD → fETH</text>
        <rect x="360" y="10" width="85" height="22" rx="6" fill="#38BDF8" fill-opacity="0.2"/>
        <text x="402" y="25" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">CALM</text>
        <text x="560" y="26" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="14" font-weight="800">5.00 bp</text>
        <text x="618" y="26" fill="#10B981" font-size="13">✅</text>
      </g>

      <!-- Row 2: Congestion -->
      <g transform="translate(24, 102)">
        <rect width="642" height="42" rx="8" fill="#1E293B" fill-opacity="0.4"/>
        <text x="16" y="26" fill="#FB7185" font-family="'Inter', sans-serif" font-size="13" font-weight="700">0x931c22...</text>
        <text x="160" y="26" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">Rapid Buy Burst</text>
        <rect x="360" y="10" width="105" height="22" rx="6" fill="#F43F5E" fill-opacity="0.2"/>
        <text x="412" y="25" fill="#FB7185" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">CONGESTION</text>
        <text x="560" y="26" fill="#F43F5E" font-family="'Inter', sans-serif" font-size="14" font-weight="800">5.34 bp</text>
        <text x="618" y="26" fill="#10B981" font-size="13">✅</text>
      </g>

      <!-- Row 3: Counterflow -->
      <g transform="translate(24, 152)">
        <rect width="642" height="42" rx="8" fill="#1E293B" fill-opacity="0.4"/>
        <text x="16" y="26" fill="#4ADE80" font-family="'Inter', sans-serif" font-size="13" font-weight="700">0xf6a925...</text>
        <text x="160" y="26" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">Restorative Sell</text>
        <rect x="360" y="10" width="115" height="22" rx="6" fill="#10B981" fill-opacity="0.2"/>
        <text x="417" y="25" fill="#4ADE80" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">COUNTERFLOW</text>
        <text x="560" y="26" fill="#22C55E" font-family="'Inter', sans-serif" font-size="14" font-weight="800">4.61 bp</text>
        <text x="618" y="26" fill="#10B981" font-size="13">✅</text>
      </g>

      <!-- Subline in proof card -->
      <text x="24" y="215" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">
        Hook: 0x984439E305dD17e7a16f2aAf876d99d9D7C710c0 (CREATE2 flags 0x10C0) • Base Sepolia
      </text>
    </g>
  </g>

  <!-- ================= FOOTER / REPO BAR ================= -->
  <g transform="translate(120, 960)">
    <line x1="0" y1="0" x2="1680" y2="0" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    
    <text x="0" y="45" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="18" font-weight="500">
      GitHub Repository: <tspan fill="#F8FAFC" font-weight="700">https://github.com/emarc99/fairflow</tspan>
    </text>

    <text x="1680" y="45" fill="#64748B" font-family="'Inter', sans-serif" font-size="18" font-weight="600" text-anchor="end">
      21 Passing Foundry Tests • 91.1% Coverage • Next.js Web3 Dashboard
    </text>
  </g>
</svg>
